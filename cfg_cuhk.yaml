dataset_name: cuhkpedes
device: 0
misc: {seed: 0}
num_of_experts_groups: 2
num_of_experts: 6
num_of_selected_experts: 5
expert_blocks: [6, 7, 8]
experiment:
  grad_checkpoint: true
  use_bridge: false
  bridge_cv_ratio: 0.0
  bridge_tg_ratio: 0.0
  nrw_mode: 'off'
  nrw_alpha: 2.0
  nrw_min_weight: 0.2
  nrw_warmup_epochs: 3
  nrw_ema: 0.99
  nrw_fixed_aerial: 0.8
  view_ratio: 1.0
  ortho_ratio: 1.0
  disable_moe: true
  max_words: 77
  use_ema: false
  ema_decay: 0.999
  view_prompt: false
  rerank: false
  rerank_k1: 20
  rerank_k2: 6
  rerank_lambda: 0.3
  csls: false
  input_resolution: [224, 224]
  dropout: 0.05
  text_length: 77
  nitc_ratio: 1.0
  dhn_margin: 0.0
  sdm_ratio: 0.0
  tal_ratio: 0.0
  tal_margin: 0.1
  tal_tau: 0.02
  ritc: true
  ritc_eps: 1.0e-2
  ritc_ratio: 1.0
  id: true
  id_ratio: 0.5
schedule:
  lr: 1.0e-4
  epoch: 10
  epoch_warmup: 1
  lr_start: 1.0e-6
  lr_end: 5.0e-6
  weight_decay: 0.02
  betas: [0.9, 0.98]
  eps: 1.0e-8
  ratio_factor: 1.0
model:
  backbone: 'ViT-B/16'
  expert_blocks_auto: true
  ckpt_type: original_clip
  saved_path: experiments_ext
  checkpoint: '${CLIP_B16_CHECKPOINT}'
  use_gather: true
  softlabel_ratio: 0.5
  embed_dim: 512
  vocab_size: 49408
log: {print_period: 50}
data:
  global_batch_size: 320
  batch_size: 320
  test_batch_size: 32
  num_workers: 2
distributed: {backend: nccl, url: 'env://'}
external:
  data_root: /root/autodl-tmp/datasets
  output_root: experiments_ext
  eval_split: test
  annotation_paths: [CUHK-PEDES/reid_raw.json]
  train_samples: 68126
  num_classes: 11003
  extract_bank_text: true
  extract_extra_images: true
